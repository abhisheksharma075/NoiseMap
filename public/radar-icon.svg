<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium High-Classic Deep Forest & Obsidian Slate Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E17" />
      <stop offset="45%" stop-color="#1E2F23" />
      <stop offset="100%" stop-color="#2D4634" />
    </linearGradient>

    <!-- Signal Lime & Emerald Harmonic Sweep Gradient -->
    <linearGradient id="limeGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2F075" />
      <stop offset="60%" stop-color="#CDE350" />
      <stop offset="100%" stop-color="#8DA737" />
    </linearGradient>

    <!-- Acoustic Wave Sector Glow -->
    <radialGradient id="acousticHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D5E66B" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#8BAE58" stop-opacity="0.25" />
      <stop offset="85%" stop-color="#2D4634" stop-opacity="0.05" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Paper Metallic Accent -->
    <linearGradient id="warmPaperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F2" />
      <stop offset="100%" stop-color="#DCD7C9" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Housing (Squircle / App Icon Body with refined bevel) -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="url(#warmPaperGrad)" stroke-width="2.5" stroke-opacity="0.3" />

  <!-- Ambient Sound Field Halo -->
  <circle cx="256" cy="256" r="215" fill="url(#acousticHalo)" />

  <!-- Outer Precision Geodetic Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#DCD7C9" stroke-width="2" stroke-dasharray="4 8" stroke-opacity="0.35" />

  <!-- Harmonic Resonance Ring (Forest Olive) -->
  <circle cx="256" cy="256" r="158" fill="none" stroke="#798E69" stroke-width="3.5" stroke-opacity="0.75" />

  <!-- Dynamic Acoustic Wave Arc (Signal Lime Highlight) -->
  <circle cx="256" cy="256" r="112" fill="none" stroke="url(#limeGoldGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="440 180" filter="url(#subtleGlow)" />

  <!-- Precision Geodetic Crosshairs (Subtle instrument reticle) -->
  <line x1="256" y1="38" x2="256" y2="474" stroke="url(#warmPaperGrad)" stroke-width="2" stroke-opacity="0.4" />
  <line x1="38" y1="256" x2="474" y2="256" stroke="url(#warmPaperGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- 4 Cardinal Geodetic Nodes -->
  <circle cx="256" cy="56" r="5" fill="#D5E66B" />
  <circle cx="256" cy="456" r="5" fill="#D5E66B" />
  <circle cx="56" cy="256" r="5" fill="#D5E66B" />
  <circle cx="456" cy="256" r="5" fill="#D5E66B" />

  <!-- Concentric Acoustic Wave Crests (Top-Right Sector) -->
  <path d="M 256 186 A 70 70 0 0 1 326 256" fill="none" stroke="#E2F075" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.85" />
  <path d="M 256 146 A 110 110 0 0 1 366 256" fill="none" stroke="#CDE350" stroke-width="3" stroke-linecap="round" stroke-opacity="0.65" />
  <path d="M 256 106 A 150 150 0 0 1 406 256" fill="none" stroke="#8DA737" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6" stroke-opacity="0.5" />

  <!-- Center Bio-Acoustic Core Housing -->
  <circle cx="256" cy="256" r="38" fill="#141E17" stroke="url(#warmPaperGrad)" stroke-width="3" stroke-opacity="0.8" />
  <circle cx="256" cy="256" r="24" fill="url(#limeGoldGrad)" filter="url(#subtleGlow)" />
  <circle cx="256" cy="256" r="8" fill="#141E17" />
</svg>
