<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A10" />
      <stop offset="50%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Canvas Background with Rounded Border -->
  <rect x="2" y="2" width="796" height="236" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Retro Vector Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="100" y1="0" x2="100" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="300" y1="0" x2="300" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="500" y1="0" x2="500" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="700" y1="0" x2="700" y2="240" />
  </g>

  <!-- Technical Corner Marks (+) -->
  <g fill="#00F2FE" opacity="0.6" font-family="monospace" font-size="14" font-weight="bold">
    <text x="20" y="28">+</text>
    <text x="772" y="28">+</text>
    <text x="20" y="222">+</text>
    <text x="772" y="222">+</text>
  </g>

  <!-- Top Instrument Coordinate Telemetry -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#64748B">
    <text x="40" y="30">SYS_ID: NM-750M-GEO</text>
    <text x="220" y="30">BAND: 20Hz-20kHz</text>
    <text x="400" y="30">GRID: 100M_SNAPPED</text>
    <text x="590" y="30">MODE: PRIVACY_VERIFIED_PWA</text>
  </g>

  <!-- RADAR / ACOUSTIC SENSOR EMBLEM (LEFT) -->
  <g transform="translate(115, 130)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="64" fill="#070A10" stroke="#1E293B" stroke-width="2"/>
    <circle cx="0" cy="0" r="64" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="10 6" opacity="0.8"/>
    
    <!-- Middle dB Scale Ring -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#0891B2" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Inner Safe Zone Ring -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8"/>
    
    <!-- Radar Reticle Axes -->
    <line x1="-64" y1="0" x2="64" y2="0" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="0" y1="-64" x2="0" y2="64" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- Radar Sweep Cone -->
    <path d="M 0 0 L 45 -45 A 64 64 0 0 0 0 -64 Z" fill="url(#radarSweep)"/>
    
    <!-- Simulated Acoustic Hotspot Beacons -->
    <circle cx="24" cy="-18" r="4.5" fill="#EF4444" filter="url(#cyanGlow)"/>
    <circle cx="-16" cy="28" r="3.5" fill="#F59E0B"/>
    <circle cx="-32" cy="-22" r="3" fill="#10B981"/>
    
    <!-- Center Hardware Node -->
    <circle cx="0" cy="0" r="5" fill="#00F2FE" filter="url(#cyanGlow)"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>

  <!-- LOGO BRANDING & HEADLINE (RIGHT) -->
  <g transform="translate(230, 95)">
    <!-- Badge Indicator -->
    <rect x="0" y="-18" width="180" height="20" rx="4" fill="rgba(0, 242, 254, 0.08)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1"/>
    <circle cx="10" cy="-8" r="3.5" fill="#00F2FE"/>
    <text x="20" y="-5" font-family="ui-monospace, monospace" font-size="9" font-weight="bold" fill="#00F2FE" letter-spacing="1.5">
      ACOUSTIC RADAR ENGINE
    </text>

    <!-- Main Title -->
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      NOISE<tspan fill="url(#accentText)">MAP</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600" fill="#94A3B8" letter-spacing="0.5">
      Privacy-First Civic Acoustic Sensor Grid &amp; Evidence Engine
    </text>

    <!-- Architecture Pill Badges -->
    <g transform="translate(0, 84)" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="104" height="22" rx="4" fill="#0F172A" stroke="#334155"/>
      <text x="10" y="15" fill="#38BDF8">⚡ ZERO-RAM-DSP</text>

      <!-- Pill 2 -->
      <rect x="114" y="0" width="108" height="22" rx="4" fill="#0F172A" stroke="#334155"/>
      <text x="124" y="15" fill="#10B981">📍 100M PRIVACY</text>

      <!-- Pill 3 -->
      <rect x="232" y="0" width="112" height="22" rx="4" fill="#0F172A" stroke="#334155"/>
      <text x="242" y="15" fill="#F59E0B">🛡️ 3+ CONSENSUS</text>

      <!-- Pill 4 -->
      <rect x="354" y="0" width="108" height="22" rx="4" fill="#0F172A" stroke="#334155"/>
      <text x="364" y="15" fill="#A855F7">📄 CPCB DOSSIER</text>
    </g>
  </g>

  <!-- Bottom Instrument Status Bar -->
  <g transform="translate(40, 222)" font-family="ui-monospace, monospace" font-size="9.5" fill="#475569">
    <text x="0" y="0">STATUTORY CITATION: NOISE POLLUTION (REGULATION &amp; CONTROL) RULES 2000</text>
    <text x="590" y="0">STATUS: ACTIVE ONLINE [2026]</text>
  </g>
</svg>
