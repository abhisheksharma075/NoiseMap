<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Deep Obsidian Forest Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1711" />
      <stop offset="50%" stop-color="#141E17" />
      <stop offset="100%" stop-color="#1F2F24" />
    </linearGradient>

    <!-- Signal Lime Glow -->
    <filter id="limeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#D5E66B" flood-opacity="0.45" />
    </filter>

    <!-- Warm Paper Tone -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F2" />
      <stop offset="100%" stop-color="#DCD7C9" />
    </linearGradient>

    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D5E66B" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#2D4634" stop-opacity="0.08" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Housing with Precision Border -->
  <rect x="2" y="2" width="796" height="236" rx="20" fill="url(#bannerBg)" stroke="#2D4634" stroke-width="2"/>

  <!-- Field Instrument Engineering Grid -->
  <g stroke="rgba(220, 215, 201, 0.04)" stroke-width="1">
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="120" y1="0" x2="120" y2="240" />
    <line x1="240" y1="0" x2="240" y2="240" />
    <line x1="360" y1="0" x2="360" y2="240" />
    <line x1="480" y1="0" x2="480" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="720" y1="0" x2="720" y2="240" />
  </g>

  <!-- Technical Corner Registration Crosses -->
  <g fill="#D5E66B" opacity="0.65" font-family="monospace" font-size="14" font-weight="bold">
    <text x="22" y="28">+</text>
    <text x="770" y="28">+</text>
    <text x="22" y="222">+</text>
    <text x="770" y="222">+</text>
  </g>

  <!-- Top Instrument Telemetry Strip -->
  <g font-family="'JetBrains Mono', monospace" font-size="10" fill="#798E69">
    <text x="45" y="30">FIELD INST: TYPE-2 CLIENT</text>
    <text x="260" y="30">GEO SECTOR: 100M SNAP</text>
    <text x="460" y="30">CPCB 2000 STATUTORY RULES</text>
    <text x="660" y="30">ZERO-KYC REPUTATION</text>
  </g>

  <!-- ==================== LEFT: THE NOISEMAP HIGH-CLASSIC VECTOR LOGO ==================== -->
  <g transform="translate(48, 48)">
    <!-- Ambient Halo -->
    <circle cx="72" cy="72" r="70" fill="url(#haloGlow)" />

    <!-- Outer Squircle Housing -->
    <rect width="144" height="144" rx="34" fill="#141E17" stroke="#354C3C" stroke-width="2" />
    <rect x="4" y="4" width="136" height="136" rx="30" fill="none" stroke="#FAF8F2" stroke-width="1" stroke-opacity="0.25" />

    <!-- Geodetic Dotted Outer Ring -->
    <circle cx="72" cy="72" r="56" fill="none" stroke="#FAF8F2" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.4" />

    <!-- Resonance Ring (Olive) -->
    <circle cx="72" cy="72" r="43" fill="none" stroke="#798E69" stroke-width="2" stroke-opacity="0.75" />

    <!-- Dynamic Acoustic Wave Arc (Lime) -->
    <circle cx="72" cy="72" r="30" fill="none" stroke="#D5E66B" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="120 50" filter="url(#limeGlow)" />

    <!-- Acoustic Wave Crests -->
    <path d="M 72 52 A 20 20 0 0 1 92 72" stroke="#E2F075" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
    <path d="M 72 41 A 31 31 0 0 1 103 72" stroke="#CDE350" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.7" />

    <!-- Geodetic Crosshairs -->
    <line x1="72" y1="12" x2="72" y2="132" stroke="#FAF8F2" stroke-width="1" stroke-opacity="0.35" />
    <line x1="12" y1="72" x2="132" y2="72" stroke="#FAF8F2" stroke-width="1" stroke-opacity="0.35" />

    <!-- Bio-Acoustic Core Node -->
    <circle cx="72" cy="72" r="8" fill="#141E17" stroke="#FAF8F2" stroke-width="1.5" />
    <circle cx="72" cy="72" r="5" fill="#D5E66B" filter="url(#limeGlow)" />
  </g>

  <!-- ==================== RIGHT: HIGH-CLASSIC TYPOGRAPHY & WORDMARK ==================== -->
  <g transform="translate(225, 62)">
    <!-- Brand Title -->
    <text x="0" y="58" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="52" letter-spacing="-1.5" fill="#FAF8F2">
      NOISE<tspan fill="#D5E66B">MAP</tspan>
    </text>

    <!-- PWA Badge -->
    <rect x="290" y="20" width="48" height="24" rx="6" fill="#1E2F23" stroke="#354C3C" stroke-width="1.5"/>
    <text x="314" y="36" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#D5E66B" text-anchor="middle">
      PWA
    </text>

    <!-- Subtitle -->
    <text x="0" y="90" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="16" fill="#DCD7C9" letter-spacing="0.2">
      Civic Acoustic Intelligence &amp; Distributed Environmental Sensor Grid
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 114)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#798E69">
      <circle cx="5" cy="-4" r="3" fill="#D5E66B" />
      <text x="14" y="0">10-Sec Transient Leq</text>
      
      <circle cx="160" cy="-4" r="3" fill="#D5E66B" />
      <text x="169" y="0">~100m Privacy Snapping</text>
      
      <circle cx="335" cy="-4" r="3" fill="#D5E66B" />
      <text x="344" y="0">CPCB Rule 5 &amp; 7 Legal Dossier</text>
    </g>
  </g>
</svg>
